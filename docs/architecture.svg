<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">Neighbour In Need — architecture</text>
  <text x="600" y="66" text-anchor="middle" font-size="14" fill="#6b7280">One SOS press → the right neighbour on the way. Strands Agents SDK agents on AWS; local fallback at every hop.</text>

  <!-- Watch -->
  <rect x="40" y="130" width="200" height="90" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="140" y="165" text-anchor="middle" font-size="16" font-weight="600" fill="#1e1b4b">Wear OS watch</text>
  <text x="140" y="190" text-anchor="middle" font-size="12" fill="#374151">SOS button</text>

  <!-- Phone -->
  <rect x="320" y="130" width="220" height="90" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="430" y="160" text-anchor="middle" font-size="16" font-weight="600" fill="#1e1b4b">Android phone app</text>
  <text x="430" y="182" text-anchor="middle" font-size="12" fill="#374151">AlertRoutingService · location</text>
  <text x="430" y="200" text-anchor="middle" font-size="12" fill="#374151">WearDataLayer · SMS fallback</text>

  <!-- Dispatcher -->
  <rect x="640" y="110" width="300" height="130" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="790" y="140" text-anchor="middle" font-size="16" font-weight="600" fill="#064e3b">Dispatcher agent</text>
  <text x="790" y="162" text-anchor="middle" font-size="12" fill="#374151">Strands Agents SDK · Bedrock model</text>
  <text x="790" y="184" text-anchor="middle" font-size="12" fill="#374151">tools: get_nearby_members · create_ticket</text>
  <text x="790" y="202" text-anchor="middle" font-size="12" fill="#374151">update_ticket · notify_group</text>
  <text x="790" y="226" text-anchor="middle" font-size="11" fill="#6b7280">AWS Lambda handler · FastAPI locally (mDNS)</text>

  <!-- Meds agent -->
  <rect x="640" y="280" width="300" height="90" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="790" y="310" text-anchor="middle" font-size="16" font-weight="600" fill="#064e3b">Medication agent</text>
  <text x="790" y="332" text-anchor="middle" font-size="12" fill="#374151">identify_medication · parse_prescription</text>
  <text x="790" y="352" text-anchor="middle" font-size="12" fill="#374151">get_member_profile · update_ticket</text>

  <!-- Firebase -->
  <rect x="1000" y="150" width="170" height="180" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1085" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#7c2d12">Firebase</text>
  <text x="1085" y="205" text-anchor="middle" font-size="12" fill="#374151">group · members</text>
  <text x="1085" y="225" text-anchor="middle" font-size="12" fill="#374151">tickets · history</text>
  <text x="1085" y="245" text-anchor="middle" font-size="12" fill="#374151">FCM topics</text>

  <!-- Responders -->
  <rect x="320" y="430" width="620" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="630" y="462" text-anchor="middle" font-size="16" font-weight="600" fill="#7f1d1d">Care group responders</text>
  <text x="630" y="486" text-anchor="middle" font-size="12" fill="#374151">neighbour with a car · relative who is a nurse · volunteer — the nearest available one is picked, the group is notified</text>

  <!-- Arrows -->
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <line x1="240" y1="175" x2="318" y2="175" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="279" y="165" text-anchor="middle" font-size="11" fill="#6b7280">Data Layer</text>
  <line x1="540" y1="165" x2="638" y2="165" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="589" y="155" text-anchor="middle" font-size="11" fill="#6b7280">mDNS HTTP POST</text>
  <line x1="540" y1="195" x2="638" y2="195" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>
  <text x="589" y="212" text-anchor="middle" font-size="11" fill="#6b7280">SMS fallback (no internet)</text>
  <line x1="940" y1="175" x2="998" y2="200" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="940" y1="325" x2="998" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="790" y1="240" x2="790" y2="278" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="790" y1="370" x2="790" y2="428" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="850" y="405" text-anchor="start" font-size="11" fill="#6b7280">notify_group → FCM</text>
  <line x1="1085" y1="330" x2="945" y2="475" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>

  <text x="600" y="580" text-anchor="middle" font-size="12" fill="#6b7280">Every step is written on the ticket, so the group knows who is going and what happened. Firebase tools return fixture data where marked TODO in the prototype.</text>
</svg>
